<!DOCTYPE html>

<html lang="es">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
    Ingreso SIGHI
</title>



<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<style>


body {

    height:100vh;

    background:#f5f7fb;

    display:flex;

    justify-content:center;

    align-items:center;

}



.login-card {

    width:400px;

    border-radius:15px;

}



.logo {

    font-size:40px;

    color:#0d6efd;

}



</style>


</head>




<body>




<div class="card shadow login-card">


<div class="card-body p-5 text-center">


<div class="logo mb-3">

<i class="bi bi-hospital"></i>

</div>



<h3 class="fw-bold">

SIGHI

</h3>


<p class="text-muted">

Sistema Integral de Gestión Hospitalaria e Ingeniería Biomédica

</p>




<form method="POST">


{% csrf_token %}



<div class="text-start">


{{ form.as_p }}


</div>



<button 
type="submit"
class="btn btn-primary w-100 mt-3">


Ingresar


</button>



</form>




{% if messages %}


{% for message in messages %}


<div class="alert alert-danger mt-3">

{{ message }}

</div>


{% endfor %}


{% endif %}



</div>


</div>



</body>


</html>
