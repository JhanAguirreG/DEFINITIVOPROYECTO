{% extends "base.html" %}


{% block title %}
Editar Institución | SIGHI
{% endblock %}



{% block content %}


<div class="container-fluid">


<div class="card shadow-sm">


<div class="card-header bg-primary text-white">


<h4 class="mb-0">

<i class="bi bi-building"></i>

Editar institución

</h4>


</div>



<div class="card-body">



<form method="POST">


{% csrf_token %}



<div class="row">


{% for field in form %}


<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

{{ field.label }}

</label>



{{ field }}



{% if field.errors %}


<div class="text-danger small">

{{ field.errors }}

</div>


{% endif %}


</div>


{% endfor %}



</div>




<div class="mt-3">


<a href="{% url 'lista_instituciones' %}"
class="btn btn-secondary">


<i class="bi bi-arrow-left"></i>

Cancelar


</a>




<button type="submit"
class="btn btn-primary">


<i class="bi bi-save"></i>

Actualizar


</button>



</div>



</form>



</div>


</div>


</div>



{% endblock %}
